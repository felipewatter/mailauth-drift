name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout pinned action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python pinned action
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build and test tools
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Python compile
        run: python -m compileall -q src scripts tests
      - name: Unit and CLI tests
        run: pytest -q
      - name: Security demonstration - trusted baseline
        run: mailauth-drift scan --snapshot examples/baseline.json --fail-on high
      - name: Security demonstration - expected diff regression
        shell: bash
        run: |
          set +e
          mailauth-drift diff --baseline examples/baseline.json --candidate examples/candidate.json --fail-on-regression
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then echo "Expected security gate exit 1, got $status"; exit 1; fi
      - name: Build source and wheel
        run: python -m build
      - name: Reproducible ZIP and checksum validation
        run: |
          python scripts/package.py
          python scripts/verify_package.py
