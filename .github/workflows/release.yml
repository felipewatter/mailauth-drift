name: Release after successful CI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    name: Publish v0.1.0 from verified main commit
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exactly the commit whose CI passed
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Confirm that the validated commit is still main HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$VERIFIED_SHA" || { echo 'main moved after CI: refusing stale release'; exit 1; }
      - name: Build reproducible archive and verify integrity
        run: |
          python scripts/package.py
          python scripts/verify_package.py
      - name: Create immutable tag and publish release once
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo 'Release already exists. Not changing published release.'
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.0" >/dev/null 2>&1; then
            echo 'Tag already exists without release. Manual review required; refusing to move tag.'
            exit 1
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref='refs/tags/v0.1.0' -f "sha=$VERIFIED_SHA"
          gh release create v0.1.0 \
            dist/mailauth-drift-v0.1.0.zip \
            dist/SHA256SUMS \
            --title 'MailAuth Drift v0.1.0' \
            --notes-file CHANGELOG.md \
            --verify-tag
